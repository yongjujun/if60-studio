facts_to_check:
  - "슈바르츠실트 반지름 r = 2GM/c², 지구를 압축하면 반지름 약 8.9mm — https://en.wikipedia.org/wiki/Schwarzschild_radius"
  - "지름 1cm(반지름 5mm) → 질량 약 3.37×10^24 kg, 지구의 약 0.56배 (r·c²/2G 계산)"
  - "50m 거리 중력가속도 GM/r² ≈ 9.0×10^10 m/s² ≈ 92억 g, 70kg 사람의 무게 약 6.4억 톤 (계산)"
  - "50m에서 중심까지 자유낙하 시간 (π/2)·√(r³/2GM) ≈ 26µs (계산)"
  - "50m 지점 시간 지연 √(1−r_s/r) ≈ 0.99995 — 거의 느려지지 않음 (계산)"
  - "1km 2,300만 g · 10km 23만 g · 부산(약 325km) 217g · 도쿄(약 1,160km) 17g · 지구 반대편(약 12,700km) 0.14g (GM/r² 계산)"
  - "중력의 변화는 빛의 속도로 전달 — 325km는 약 1.1ms, 1,160km는 약 3.9ms (거리÷광속)"
  - "지구 표면이 중심까지 떨어지는 시간 대략 12분 (질량 1.56배 기준 자유낙하 근사, 실제 붕괴 과정은 더 복잡)"
  - "합쳐진 질량 지구 1.56배의 블랙홀 반지름 약 13.9mm, 지름 약 2.8cm (계산)"
