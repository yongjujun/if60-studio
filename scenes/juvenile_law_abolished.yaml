# 촉법소년 제도가 폐지된 대한민국? (약 95초, 17장면) — 블랙코미디·풍자 예시
# 구조: 콜드 오픈(지우개 재판) → 되감기 → 사실 설정 → 가상 전개(황당함이 커짐) → 찬성·반대 양쪽 → 실제 상황 → 질문 카드
# 4단 구성: 도입(1~5) → 전개(6~11) → 반전(12~14) → 결말(15~17), AI 이미지 9장(keyframes)
# 결과의 연쇄: 1단계(7 법원 앞 줄) → 2단계(8~10 판사 업무량·소년원 수용률 — 실제 수치로 계산한 현실적인 파급)
# 시청 유지: 1장면 훅(3초 안) → 5장면 중간 반전(약 20초) → 15장면 펀치라인(payoff) → 질문 카드
# 풍자의 과녁은 '제도와 숫자'. 아이·피해자를 웃음거리로 쓰지 않고, 찬반 어느 편도 들지 않는다.
#
# facts_to_check (2026년 7월 기준 — 올리기 전에 최신 상황 다시 확인!)
#   - 촉법소년: 만 10세 이상 14세 미만, 형사처벌 대신 소년법상 보호처분. 1953년 형법 제정 때부터 14세 기준
#     — 뉴시스 2026.07.14 https://www.newsis.com/view/NISX20260714_0003708015
#   - 촉법소년 소년부 송치: 2021년 11,677명 → 2025년 21,095명 (경찰청, 파이낸셜뉴스) https://www.fnnews.com/news/202607160631094884
#   - 2025년 송치 21,095명 중 절도 10,110건 (약 48%) — 뉴시스 같은 기사
#   - 살인: 2021년 2건 → 2025년 0건 (파이낸셜뉴스)
#   - 소년원 등 수용률 전국 평균 112% (뉴시스, 정부 자료)
#   - 소년부 판사 약 25명 — 한 법학 교수의 지적 (파이낸셜뉴스) / 21,095 ÷ 25 ≈ 843건, ÷ 365 ≈ 2.3건 (계산)
#   - 정부안(2026.7): 강력·중대·반복 범죄에 한해 13세부터 형사처벌 추진, 법 개정 전 (뉴시스)
#   - 지우개 재판 장면은 상상(가상 상황)이며 실제 정책이 아님
