# 만약에 잠을 저축할 수 있다면? (약 1분 50초) — 결과 사다리(format: ladder) 예시
# 가정 하나만 비현실, 그 뒤는 현실적으로: 침실 → 출근길 → 회사 → 은행 → 병원 → 부동산 → 카페 → 편의점 → 놀이시설
#   → 제도(인증제·시험장 안내문) → 반전(실제 연구) → 콜백 → 다음 편 예고 → 질문 카드. 사람 이름 없이 역할로만, 유머는 가볍게.
# 웃음의 절반은 3D 속 글자(sign): 은행 간판, 매물 카드, 시술 안내, 가격표, 현수막. 얼굴 클로즈업은 bust(표정).
#
# facts_to_check
#   - 성인(18~60세) 권장 수면 하루 7시간 이상 — CDC https://www.cdc.gov/sleep/about/index.html
#   - 8시간 × 연 3.5% = 16.8분 (계산, 상상 속 '수면 적금')
#   - 3년 × 365일 × 8시간 = 8,760시간 (계산)
#   - 주말에 몰아 자도 평일 수면 부족의 영향이 다 회복되지 않음 (2019 연구) — NIH https://www.nih.gov/news-events/nih-research-matters/weekend-catch-cant-counter-chronic-sleep-deprivation
#   - 나머지는 전부 상상(가상 상황)
title: 만약에 잠을 저축할 수 있다면?
format: ladder
genre: absurd
style: voxel
cast:
  - {role: 한 직장인, color: "#f4f4f4"}
  - {role: 편의점 알바생, color: "#f2c94c"}
layout:
  style: simple
  title: 만약에 잠을 통장처럼 저축할 수 있다면?
facts_to_check:
  - "성인 권장 수면 하루 7시간 이상 — https://www.cdc.gov/sleep/about/index.html"
  - "8시간 × 3.5% ≈ 17분 (계산)"
  - "3년 × 365일 × 8시간 = 8,760시간 (계산)"
  - "주말 몰아 자기로는 수면 부족이 다 회복되지 않음 — https://www.nih.gov/news-events/nih-research-matters/weekend-catch-cant-counter-chronic-sleep-deprivation"
keyframes:
  - {id: 1, desc: "주말 침대에 이불을 뒤집어쓴 직장인, 벽 화면에 수면 잔고", prompt: "cozy bedroom at night, office worker buried under blanket on a bed, wall screen glowing, voxel art, vertical 9:16, no text"}
  - {id: 2, desc: "정색한 직장인 얼굴 클로즈업", prompt: "close-up of a blocky voxel office worker face with a deadpan expression, plain warm background, vertical 9:16, no text"}
  - {id: 3, desc: "출근길 엘리베이터 속 조용한 사람들", prompt: "open elevator full of calm office workers seen from the hallway, voxel art, vertical 9:16, no text"}
  - {id: 4, desc: "넓은 사무실, 아무도 졸지 않음", prompt: "open-plan office with rows of desks and glowing monitors, alert workers, voxel art, vertical 9:16, no text"}
  - {id: 5, desc: "길가 은행 외관과 창에 붙은 적금 안내", prompt: "small street-side bank storefront with posters in the window, sunny day, voxel art, vertical 9:16, no text"}
  - {id: 6, desc: "피부과 접수대와 대기 의자", prompt: "bright clinic reception desk with waiting chairs, voxel art, vertical 9:16, no text"}
  - {id: 7, desc: "부동산 창문의 매물 카드들", prompt: "real estate office window covered with listing cards, voxel art, vertical 9:16, no text"}
  - {id: 8, desc: "텅 빈 카페 계산대", prompt: "empty cafe counter with a menu board, no customers, voxel art, vertical 9:16, no text"}
  - {id: 9, desc: "편의점 계산대 가격표", prompt: "convenience store counter with colorful shelves, voxel art, vertical 9:16, no text"}
  - {id: 10, desc: "워터파크 선베드에서 단체로 자는 사람들", prompt: "water park deck with many people sleeping on loungers, banner in background, voxel art, vertical 9:16, no text"}
  - {id: 11, desc: "시험장 복도 게시판의 안내문", prompt: "school exam hallway with a notice board, calm morning light, voxel art, vertical 9:16, no text"}
  - {id: 12, desc: "주민센터 앞 인증 줄", prompt: "queue of people on a sidewalk in front of a community service center, voxel art, vertical 9:16, no text"}
  - {id: 13, desc: "밤의 아파트 단지", prompt: "apartment complex at night seen from above, most windows dark, voxel art, vertical 9:16, no text"}

