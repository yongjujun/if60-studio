# 쉬운 해설 예시 — 겨울엔 왜 정전기가 더 잘 생길까? (약 75초, 14장면)
# 구조: 훅 → 답 먼저 → 원리(비유) → 궁금증 하나 → 실제 수치(출처) → 생활 팁 → 한 줄 정리 → 질문 카드
title: 겨울엔 왜 정전기가 더 잘 생길까?
format: explainer
genre: science
style: voxel
layout: {style: simple, title: "겨울엔 왜\n정전기가 더 잘 생길까?"}
facts_to_check:
  - "두 물체가 닿았다 떨어지면 전하가 한쪽에 남는다 — https://www.pa.uky.edu/sciworks/THE/heat/static.htm"
  - "습하면 물체 표면의 얇은 물막이 전하를 흘려보낸다 — https://www.pa.uky.edu/sciworks/THE/heat/static.htm"
  - "차가운 공기를 난방으로 데워도 수분 양은 그대로라 실내가 건조해진다 — https://www.pa.uky.edu/sciworks/THE/heat/static.htm"
  - "습도 10~20%에서 카펫 위를 걸으면 약 35,000V, 습도 60~90%에선 약 1,500V — https://www.sciencetimes.co.kr/news/%EC%A0%95%EC%A0%84%EA%B8%B0-%EA%B2%A8%EC%9A%B8%EC%9D%B4%EB%A9%B4-%EC%B0%BE%EC%95%84%EC%98%A4%EB%8A%94-%EB%B6%88%EC%B2%AD%EA%B0%9D/"
  - "사람은 약 2,500~4,000V부터 정전기를 느낀다, 전압은 높아도 전류가 매우 작아 위험하지 않다 — 위 사이언스타임즈 기사 https://www.sciencetimes.co.kr/news/%EC%A0%95%EC%A0%84%EA%B8%B0-%EA%B2%A8%EC%9A%B8%EC%9D%B4%EB%A9%B4-%EC%B0%BE%EC%95%84%EC%98%A4%EB%8A%94-%EB%B6%88%EC%B2%AD%EA%B0%9D/"
  - "예방: 가습기·젖은 빨래로 습도 올리기, 보습, 금속은 손가락 끝이나 열쇠로 먼저 대기 — 위 기사 https://www.sciencetimes.co.kr/news/%EC%A0%95%EC%A0%84%EA%B8%B0-%EA%B2%A8%EC%9A%B8%EC%9D%B4%EB%A9%B4-%EC%B0%BE%EC%95%84%EC%98%A4%EB%8A%94-%EB%B6%88%EC%B2%AD%EA%B0%9D/"
