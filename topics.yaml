# 만물제작소 주제 목록 — `python -m if60 make 3` 처럼 번호로 바로 제작
# genre: satire(사회·제도 — 균형 있게) | science(과학 — 정확하게) | absurd(비현실적 가정 — 진지하게)
# 톤: 개그 없이 진중한 정보 다큐. 모든 수치는 검색 확인 또는 계산, 사실·추정·가정을 구분
# format(선택): ladder(결과 사다리 — 상상 하나를 생활 곳곳에, 약 2분) | broadcast(방송형). 없으면 작가가 주제 보고 고름
# tangents: 전개 아이디어 — 1단계(직접 결과) → 2단계(현실적인 파급). 참고용, 더 현실적인 게 있으면 작가가 바꿈
# angle: 대본 작가에게 주는 방향 힌트 (사실·수치는 매번 웹 검색으로 새로 확인)
# 새 주제는 같은 형식으로 아래에 추가하면 됩니다.

topics:
  - id: 1
    title: 대한민국에서 모든 사기꾼의 머리 위에 전과가 표시된다면?
    genre: satire
    tangents: 1단계 보이스피싱범이 출근길 지하철에서 바로 들통 → 2단계 채용·임대 심사에서 표시 확인이 관행이 되고 오표시 정정 소송 증가
    angle: >-
      사기 범죄 규모·재범률 같은 실제 수치로 시작. 보이스피싱·전세사기 피해가 실제로 얼마나 줄 수 있는지 계산.
      반전: 표시 기준(유죄 확정만? 기소만?)과 갱생·오표시 문제, 그리고 아직 안 잡힌 사기꾼은 표시가 없다는 허점.

  - id: 2
    title: 갑질을 하면 고객 등급이 자동으로 떨어지는 대한민국
    genre: satire
    tangents: 1단계 '사장 나와' 한마디에 VIP가 브론즈로 → 2단계 감정노동자 이직률·고객 응대 매뉴얼이 실제로 바뀌는 과정
    angle: >-
      감정노동자 폭언 경험 비율 등 실제 통계로 시작. 등급 하락이 소비 행동과 서비스 현장에 주는 영향.
      반전: 등급은 누가 매기나 — 평가하는 쪽도 평가받는 사회. 특정 기업·브랜드 이름은 쓰지 않는다.

  - id: 3
    title: 거짓말하는 정치인의 마이크가 자동으로 꺼진다면?
    genre: satire
    tangents: 1단계 첫 본회의 3분 만에 전원 음소거 → 2단계 발언 전 사실 확인 절차가 생기고 회의 시간·법안 처리 속도가 바뀜
    angle: >-
      실존 정치인·정당은 절대 등장시키지 않고, 진영 구분 없이 '모든 정치인'에게 똑같이 적용되는 가상 제도로.
      국회 회의 시간·공약 이행률 같은 확인된 수치를 활용. 제도가 생기면 회의 방식이 어떻게 바뀌는지.
      반전: '거짓말'과 '틀린 예측·약속 미이행'의 경계, 그리고 마이크를 끄는 기계는 누가 만드나.

  - id: 4
    title: 인간이 광합성을 할 수 있게 된다면?
    genre: science
    format: ladder
    tangents: 1단계 점심값 0원 → 2단계 햇빛 드는 공간의 가치 상승, 식량 수요 변화
    angle: >-
      사람 피부 면적(약 1.8㎡)과 광합성 효율로 하루에 얻는 열량을 실제로 계산 → 하루 필요 열량과 비교.
      반전: 실제로 광합성 하는 동물(푸른갯민숭달팽이 등)의 사례와, 실제로 얻는 열량이 필요량에 크게 못 미친다는 계산 결과.

  - id: 5
    title: 지구의 모든 곤충이 하루아침에 사라진다면?
    genre: science
    format: ladder
    tangents: 1단계 모기 없는 첫 여름밤 → 2단계 초콜릿·과일값이 금값(작은 곤충이 꽃가루받이하는 작물)
    angle: >-
      곤충 종 수·생물량, 꽃가루받이에 의존하는 작물 비율 같은 실제 수치. 1일차·1주·1년 순서로 무너지는 연쇄.
      반전: 모기 없는 첫날 → 사체·배설물을 분해할 존재가 사라져 세상이 썩지 않고 쌓이는 문제.

  - id: 6
    title: 모든 사람의 통장 잔고가 머리 위에 표시된다면?
    genre: satire
    tangents: 1단계 대인 관계·거래에서 잔고가 판단 기준이 됨 → 2단계 잔고를 숨기려 현금 보유가 늘고 금융 범죄 표적 문제가 생김
    angle: >-
      가계 순자산 분포·평균과 중위값 차이 같은 실제 통계로 시작. 소비·대인 관계·범죄 위험이 어떻게 바뀌는지.
      반전: 잔고는 많지만 빚이 더 큰 사람, 잔고 0인데 부자인 사람(주식·부동산) — 숫자 하나로는 아무것도 모른다.

  - id: 7
    title: 대한민국에서 모든 사람이 하루에 한 번만 말을 할 수 있다면?
    genre: absurd
    format: ladder
    tangents: 1단계 회의가 3초 만에 끝 → 2단계 문자·수어·비언어 의사소통 수요 증가, 고객센터·교육 방식 변화
    angle: >-
      한 사람이 하루에 하는 말의 양(단어 수 연구)을 근거로 정부 발표처럼 진지하게 전개. 회의·연애·고객센터가 어떻게 바뀌는지.
      반전: 단 한 번의 말을 아끼느라 오히려 사람들이 서로의 말을 끝까지 듣게 된다.

  - id: 8
    title: 모든 인간이 타인의 감정을 느낄 수 있다면?
    genre: absurd
    tangents: 1단계 출근길 지하철 한 칸의 피로가 전원에게 공유 → 2단계 면접·의료·상담 현장에서 감정 공유가 판단에 주는 영향
    angle: >-
      거울 뉴런·정서 전염 연구 등 확인된 과학으로 진지하게 설명. 출퇴근 지하철 한 칸의 감정 총량, 거짓 미소가 불가능한 회사.
      반전: 가장 먼저 무너지는 건 악플과 사기 — 그리고 사람들이 혼자 있는 시간을 사려고 줄을 선다.

  - id: 9
    title: 인간의 외모가 성격에 따라 변한다면?
    genre: absurd
    tangents: 1단계 거짓말 한 번에 얼굴빛이 흐려짐 → 2단계 외모 관련 산업과 평판 문화의 변화
    angle: >-
      외모 첫인상 판단 시간 같은 실제 연구로 시작해 다큐처럼 진지하게. 특정 외모·체형을 깎아내리지 않는다.
      외모로 성격을 판단하는 편견의 실제 연구도 함께. 반전: 일시적 감정과 성격을 구분할 수 없는 문제.

  - id: 10
    title: 인간의 행복을 숫자로 측정할 수 있다면?
    genre: absurd
    tangents: 1단계 행복 점수가 신분증처럼 공개 → 2단계 행복 점수가 대출·취업 심사에 쓰이며 생기는 차별 문제
    angle: >-
      한국의 실제 행복지수 순위·삶의 만족도 통계로 시작해 공식 통계 발표처럼 진지하게.
      행복 점수가 신용점수처럼 대출·취업·연애에 쓰이는 사회. 반전: 점수를 올리려고 애쓰다 모두의 점수가 떨어진다.

  - id: 11
    title: 대한민국에서 AI가 모든 면접을 대신 본다면?
    genre: satire
    tangents: 1단계 인맥 채용이 줄어듦 → 2단계 AI 평가 기준 공개 요구와 알고리즘 편향 문제
    angle: >-
      실제 기업·공공기관의 AI 역량검사·AI 면접 도입 현황과 수치로 시작. 공정성 효과와 편향 위험을 함께.
      반전: 지원자도 AI로 답변을 만들어 결국 AI가 AI를 면접 보는 상황. 특정 기업 이름은 쓰지 않는다.

  - id: 12
    title: 대한민국에서 모든 물건에 진짜 원가가 표시된다면?
    genre: satire
    format: ladder
    tangents: 1단계 커피 한 잔의 원두값이 공개 → 2단계 가격 구조(임대료·인건비·유통) 공개 요구와 가격 정책 변화
    angle: >-
      공개된 원가 분석 자료(커피 한 잔 원두값, 생수, 영화관 팝콘 등 — 확인되는 것만)로 시작. 상표·브랜드 이름은 쓰지 않는다.
      반전: 원가에는 임대료·인건비·연구비가 빠져 있다 — 가장 비싼 건 재료가 아니라 사람과 자리였다.

  - id: 13
    title: 만약에 잠을 저축할 수 있다면?
    genre: absurd
    format: ladder
    tangents: 1단계 주말에 몰아 자고 평일엔 안 잠 → 2단계 은행에 '수면 적금', 회사가 수면 잔고로 연봉 협상
    angle: >-
      예시 회차 scenes/sleep_bank.yaml 참고. 하루 권장 수면 시간 같은 기본 수치만 확인하고 나머지는 생활 곳곳의 상상.
      침실 → 출근길 엘리베이터 → 회사 → 은행·부동산 → 병원 → 카페 업계 → 제도(인증제) 순으로 사다리를 오른다.

  - id: 14
    title: 만약에 비가 따뜻한 온수로 내린다면?
    genre: absurd
    format: ladder
    tangents: 1단계 체감 온도·우산 수요 변화 → 2단계 난방·물 사용·목욕탕 업계 변화
    angle: >-
      등장인물(이름 없이 역할로): 동네 목욕탕 사장님, 우산 가게 사장님. weather: rain으로 따뜻한 비를 보여준다.
      실제 수치: 연간 강수량·목욕탕 수 감소 추이 같은 확인된 숫자 한두 개. 재난문자 "오늘 오후 온수 비, 실외 세안 자제".
      반전: 겨울이 오면 온수 비가 식어 내리는 순간 — 결말 클리프행어로.

  - id: 15
    title: 만약에 고양이가 사람 말을 할 수 있다면?
    genre: absurd
    format: ladder
    tangents: 1단계 새벽 4시 '밥' 소리에 집사 기상 → 2단계 반려동물 의료·보호 제도와 동물 복지 기준 변화
    angle: >-
      반려묘 가구 수 같은 실제 통계로 시작. 고양이의 실제 발성·인지 연구를 근거로.
      반전: 고양이의 발성 기관·뇌 구조상 실제로 가능한 범위.

