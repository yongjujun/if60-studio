# 만물제작소 주제 목록 — `python -m if60 make 3` 처럼 번호로 바로 제작
# genre: satire(사회 풍자 — 통쾌하게) | science(과학 — 흥미롭게) | absurd(황당한 가정 — 진지하게)
# format(선택): ladder(결과 사다리 — 상상 하나를 생활 곳곳에, 약 2분) | broadcast(방송형). 없으면 작가가 주제 보고 고름
# tangents: 웃음 설계 아이디어 — 1절(직접 결과) → 2절(엉뚱한 부작용) → 3절(삼천포). 참고용, 더 웃긴 게 있으면 작가가 바꿈
# angle: 대본 작가에게 주는 방향 힌트 (사실·수치는 매번 웹 검색으로 새로 확인)
# 새 주제는 같은 형식으로 아래에 추가하면 됩니다.

topics:
  - id: 1
    title: 대한민국에서 모든 사기꾼의 머리 위에 전과가 표시된다면?
    genre: satire
    tangents: 1절 보이스피싱범이 출근길 지하철에서 바로 들통 → 2절 한여름에도 털모자 매출 폭증 → 3절 모자 쓴 사람이 의심받자 결혼식 하객 전원 삭발, 미용실 바리캉 품귀
    angle: >-
      사기 범죄 규모·재범률 같은 실제 수치로 시작. 보이스피싱·전세사기 가해자가 출근길·소개팅에서 바로 들통나는 통쾌함.
      반전: 표시 기준(유죄 확정만? 기소만?)과 갱생·오표시 문제, 그리고 아직 안 잡힌 사기꾼은 표시가 없다는 허점.

  - id: 2
    title: 갑질을 하면 고객 등급이 자동으로 떨어지는 대한민국
    genre: satire
    tangents: 1절 '사장 나와' 한마디에 VIP가 브론즈로 → 2절 카페에서 손님끼리 '먼저 주문하세요' 양보 대치 30분 → 3절 손님이 직원 눈치를 보다 지쳐 '손님 전용 감정노동 상담센터' 개설
    angle: >-
      감정노동자 폭언 경험 비율 등 실제 통계로 시작. VIP 카드가 갑질 한 번에 '브론즈 → 블랙리스트'로 떨어지는 통쾌함.
      반전: 등급은 누가 매기나 — 평가하는 쪽도 평가받는 사회. 특정 기업·브랜드 이름은 쓰지 않는다.

  - id: 3
    title: 거짓말하는 정치인의 마이크가 자동으로 꺼진다면?
    genre: satire
    tangents: 1절 첫 본회의 3분 만에 전원 음소거 → 2절 의원들이 화이트보드 필담으로 토론, 국회에 화이트보드 300개 → 3절 보드마커 품귀로 문구 업계 역대 최대 실적, 마커 색깔로 진영이 갈림
    angle: >-
      실존 정치인·정당은 절대 등장시키지 않고, 진영 구분 없이 '모든 정치인'에게 똑같이 적용되는 가상 제도로.
      국회 회의 시간·공약 이행률 같은 확인된 수치를 활용. 첫날 국회가 정적에 빠지는 통쾌함.
      반전: '거짓말'과 '틀린 예측·약속 미이행'의 경계, 그리고 마이크를 끄는 기계는 누가 만드나.

  - id: 4
    title: 인간이 광합성을 할 수 있게 된다면?
    genre: science
    format: ladder
    tangents: 1절 점심값 0원 → 2절 점심시간 옥상 자리 쟁탈전, 남향 사무실 월세 폭등 → 3절 장마철이 곧 국가 기근, 기상청 예보가 경제 뉴스 1면, 선크림이 다이어트약 취급
    angle: >-
      사람 피부 면적(약 1.8㎡)과 광합성 효율로 하루에 얻는 열량을 실제로 계산 → 하루 필요 열량과 비교하는 놀라운 숫자.
      반전: 실제로 광합성 하는 동물(푸른갯민숭달팽이 등)의 사례와, 결국 나무처럼 하루 종일 서 있어야 하는 결론.

  - id: 5
    title: 지구의 모든 곤충이 하루아침에 사라진다면?
    genre: science
    format: ladder
    tangents: 1절 모기 없는 첫 여름밤에 환호 → 2절 초콜릿·과일값이 금값(작은 곤충이 꽃가루받이하는 작물) → 3절 사람이 붓 들고 꽃가루받이(실제 사례 확인), '꽃가루받이 공무원' 공채 경쟁률
    angle: >-
      곤충 종 수·생물량, 꽃가루받이에 의존하는 작물 비율 같은 실제 수치. 1일차·1주·1년 순서로 무너지는 연쇄.
      반전: 모기 없는 첫날의 환호 → 사체·배설물을 분해할 존재가 사라져 세상이 썩지 않고 쌓이는 문제.

  - id: 6
    title: 모든 사람의 통장 잔고가 머리 위에 표시된다면?
    genre: satire
    tangents: 1절 소개팅이 첫 3초 만에 끝 → 2절 잔고를 숨기려 월급날 전국민 현금 인출, 장판 밑 현금 시대 → 3절 장판 업계 호황, 이사 갈 때 장판부터 떼 감
    angle: >-
      가계 순자산 분포·평균과 중위값 차이 같은 실제 통계로 시작. 소개팅·회식·명품 매장 풍경이 뒤집히는 통쾌함(허세가 사라짐).
      반전: 잔고는 많지만 빚이 더 큰 사람, 잔고 0인데 부자인 사람(주식·부동산) — 숫자 하나로는 아무것도 모른다.

  - id: 7
    title: 대한민국에서 모든 사람이 하루에 한 번만 말을 할 수 있다면?
    genre: absurd
    format: ladder
    tangents: 1절 회의가 3초 만에 끝 → 2절 말을 아끼려 고개 끄덕임으로 대화, 끄덕임 해석 학원 등장 → 3절 목 통증 환자 급증, 정형외과 대기실이 가장 조용한 곳이 됨
    angle: >-
      한 사람이 하루에 하는 말의 양(단어 수 연구)을 근거로 정색한 정부 발표처럼 전개. 회의·연애·고객센터가 어떻게 바뀌는지.
      반전: 단 한 번의 말을 아끼느라 오히려 사람들이 서로의 말을 끝까지 듣게 된다.

  - id: 8
    title: 모든 인간이 타인의 감정을 느낄 수 있다면?
    genre: absurd
    tangents: 1절 출근길 지하철 한 칸의 피로가 전원에게 공유 → 2절 면접장에서 지원자 긴장이 면접관에게 전염, 면접관이 먼저 떪 → 3절 1인 노래방이 '감정 대피소'로 지정, 혼자 있을 권리 예약제
    angle: >-
      거울 뉴런·정서 전염 연구 등 확인된 과학으로 진지하게 설명. 출퇴근 지하철 한 칸의 감정 총량, 거짓 미소가 불가능한 회사.
      반전: 가장 먼저 무너지는 건 악플과 사기 — 그리고 사람들이 혼자 있는 시간을 사려고 줄을 선다.

  - id: 9
    title: 인간의 외모가 성격에 따라 변한다면?
    genre: absurd
    tangents: 1절 거짓말 한 번에 얼굴빛이 흐려짐 → 2절 성형외과 대신 봉사활동 예약 대기 6개월 → 3절 연말 기부 시즌이 최대 뷰티 대목, 화장품 회사가 자원봉사 쿠폰을 팔기 시작
    angle: >-
      외모 첫인상 판단 시간 같은 실제 연구로 시작해 다큐처럼 진지하게. 특정 외모·체형을 깎아내리지 않는다.
      성형외과 대신 '성격 교정 학원'이 붐비는 사회. 반전: 성형 대신 착하게 사는 게 가장 싼 미용이 되는 세상.

  - id: 10
    title: 인간의 행복을 숫자로 측정할 수 있다면?
    genre: absurd
    tangents: 1절 행복 점수가 신분증처럼 공개 → 2절 행복 점수 올리는 학원·과외 등장 → 3절 수능에 행복 영역 신설, 행복 1등급 컷 때문에 수험생 행복도가 역대 최저
    angle: >-
      한국의 실제 행복지수 순위·삶의 만족도 통계로 시작해 공식 통계 발표처럼 진지하게.
      행복 점수가 신용점수처럼 대출·취업·연애에 쓰이는 사회. 반전: 점수를 올리려고 애쓰다 모두의 점수가 떨어진다.

  - id: 11
    title: 대한민국에서 AI가 모든 면접을 대신 본다면?
    genre: satire
    tangents: 1절 낙하산·인맥이 통하지 않아 통쾌 → 2절 지원자들이 AI 취향을 맞추려 눈 깜빡임·미소 각도 훈련 → 3절 지원자도 AI, 면접관도 AI, 면접장에 남은 사람은 정수기 관리 직원뿐
    angle: >-
      실제 기업·공공기관의 AI 역량검사·AI 면접 도입 현황과 수치로 시작. 낙하산·학연·지연이 통하지 않는 통쾌함.
      반전: 지원자도 AI로 답변을 만들어 결국 AI가 AI를 면접 보는 상황. 특정 기업 이름은 쓰지 않는다.

  - id: 12
    title: 대한민국에서 모든 물건에 진짜 원가가 표시된다면?
    genre: satire
    format: ladder
    tangents: 1절 커피 한 잔의 원두값이 공개 → 2절 계산대에서 손님이 원가로 흥정, 대기 줄 40분 → 3절 흥정 잘하는 어르신이 최고 인기 직종, '흥정 대행' 서비스 등장
    angle: >-
      공개된 원가 분석 자료(커피 한 잔 원두값, 생수, 영화관 팝콘 등 — 확인되는 것만)로 시작하는 통쾌함. 상표·브랜드 이름은 쓰지 않는다.
      반전: 원가에는 임대료·인건비·연구비가 빠져 있다 — 가장 비싼 건 재료가 아니라 사람과 자리였다.

  - id: 13
    title: 만약에 잠을 저축할 수 있다면?
    genre: absurd
    format: ladder
    tangents: 1절 주말에 몰아 자고 평일엔 안 잠 → 2절 은행에 '수면 적금', 회사가 수면 잔고로 연봉 협상 → 3절 잠 부자 노인이 손주에게 잠을 상속, 상속세 신고 대란
    angle: >-
      예시 회차 scenes/sleep_bank.yaml 참고. 하루 권장 수면 시간 같은 기본 수치만 확인하고 나머지는 생활 곳곳의 상상.
      침실 → 출근길 엘리베이터 → 회사 → 은행·부동산 → 병원 → 카페 업계 → 농장 순으로 사다리를 오른다.

  - id: 14
    title: 만약에 비가 따뜻한 온수로 내린다면?
    genre: absurd
    format: ladder
    tangents: 1절 출근길 우산 대신 샴푸·수건 → 2절 동네 목욕탕 폐업, 장마철 아파트 '노천탕 베란다' 프리미엄 → 3절 보일러 회사가 '비 예보 연동 보일러' 출시, 기상청 예보가 가스요금 고지서에
    angle: >-
      등장인물: 동네 목욕탕 사장님, 우산 가게 사장님, 복선 인물(혼자 빨대를 사 모으는 이웃 등). weather: rain + 김(하얀 입자)으로 따뜻한 비를 보여준다.
      실제 수치: 연간 강수량·목욕탕 수 감소 추이 같은 확인된 숫자 한두 개. 재난문자 "오늘 오후 온수 비, 실외 세안 자제".
      반전: 겨울이 오면 온수 비가 식어 내리는 순간 — 결말 클리프행어로.

  - id: 15
    title: 만약에 고양이가 사람 말을 할 수 있다면?
    genre: absurd
    format: ladder
    tangents: 1절 새벽 4시 '밥' 소리에 집사 기상 → 2절 고양이 리뷰 때문에 사료 회사 주가 폭락 → 3절 고양이 노조 결성, 박스 공급 단체협약
    angle: >-
      반려묘 가구 수 같은 실제 통계로 시작. 얼굴 클로즈업(정색한 집사), 간판 개그(동물병원 '말대꾸 진료 별도'), 가치 뒤집기(말 없는 개가 인기).
      반전: 고양이가 하는 말이 사실 다 알던 내용 — "밥", "문 열어", "싫어".

